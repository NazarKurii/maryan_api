syntax = "proto3";

package connection;

option go_package = "yourmodule/internal/pb/connectionpb";

import "google/protobuf/timestamp.proto";

message FindConnectionsResponse {
  repeated FoundConnection connections = 1;
  repeated ConnectionsRange left_range = 2;
  repeated ConnectionsRange right_range = 3;
}

message FoundConnection {
  string id = 1;
  int32 price = 2;
  int32 line = 3;

  string departure_country = 4;
  string destination_country = 5;

  google.protobuf.Timestamp departure_time = 6;
  google.protobuf.Timestamp arrival_time = 7;

  int32 estimated_duration = 8;
  google.protobuf.Timestamp sell_before = 9;

  int32 tickets_left = 10;
  bool fits = 11;
}

message ConnectionsRange {
  google.protobuf.Timestamp date = 1;
  int32 number = 3;
  int32 min_price = 4;
}



